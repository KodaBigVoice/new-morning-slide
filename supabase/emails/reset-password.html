<div style="font-family:Segoe UI,Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1C3048">
  <h2 style="margin:0 0 12px">Choose a new Morning Slide password</h2>
  <p>Click the button below. Morning Slide will open and ask you for your new password.</p>
  <p style="margin:24px 0"><a href="{{ .RedirectTo }}#ms_reset={{ .TokenHash }}" style="background:#3E6489;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:bold">Choose a new password</a></p>
  <p style="color:#64798F;font-size:13px">The link works for an hour. If you didn’t ask to reset your password, you can ignore this email: your password won’t change.</p>
</div>
